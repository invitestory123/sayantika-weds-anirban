  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Floating Toggle -->
    <audio id="bgAudio" loop preload="auto">
      <source src="./editable/assets/bg-music.mp3" type="audio/mp3">
    </audio>

    <button id="audioToggleBtn" aria-label="Toggle background music" class="audio-toggle-btn">
      <svg id="musicIconPlaying" class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <svg id="musicIconMuted" class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M9 9v9"></path>
        <path d="M9 5l12-2v7"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <style>
      /* Fix cursive script font ascenders & descenders clipping across all sections */
      h1.font-script,
      h2.font-script,
      h3.font-script,
      .font-script {
        font-family: 'Great Vibes', cursive !important;
        line-height: 1.45 !important;
        padding-top: 0.22em !important;
        padding-bottom: 0.32em !important;
        padding-left: 0.12em !important;
        padding-right: 0.12em !important;
        margin-top: -0.1em !important;
        margin-bottom: -0.1em !important;
        display: inline-block !important;
        overflow: visible !important;
        box-sizing: content-box !important;
      }
      .text-gold {
        background: linear-gradient(115deg, #f6e2ae, #d9a441 40%, #f9ecc8 58%, #b9832e 85%, #f2d894) !important;
        background-origin: padding-box !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        color: transparent !important;
      }

      /* On mobile, allow event ceremony titles full width to prevent single-word line breaks */
      @media (max-width: 640px) {
        .relative.pl-20 .flex.items-baseline.justify-between {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 4px !important;
        }
      }

      .audio-toggle-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(22, 4, 8, 0.78);
        border: 1.5px solid rgba(217, 164, 65, 0.75);
        color: #e8c874;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(217, 164, 65, 0.25);
        transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .audio-toggle-btn:hover {
        transform: scale(1.08);
        border-color: #f3d68e;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7), 0 0 20px rgba(217, 164, 65, 0.45);
      }
      .audio-toggle-btn.playing {
        animation: audio-pulse 2.5s infinite ease-in-out;
      }
      .audio-toggle-btn .music-icon {
        width: 22px;
        height: 22px;
      }
      @keyframes audio-pulse {
        0%, 100% {
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(217, 164, 65, 0.3);
        }
        50% {
          box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), 0 0 22px rgba(217, 164, 65, 0.6);
        }
      }
    </style>

    <script>
      (function() {
        const audio = document.getElementById('bgAudio');
        const btn = document.getElementById('audioToggleBtn');
        const iconPlaying = document.getElementById('musicIconPlaying');
        const iconMuted = document.getElementById('musicIconMuted');
        let userInteracted = false;

        function updateUI(isPlaying) {
          if (isPlaying) {
            btn.classList.add('playing');
            iconPlaying.style.display = 'block';
            iconMuted.style.display = 'none';
          } else {
            btn.classList.remove('playing');
            iconPlaying.style.display = 'none';
            iconMuted.style.display = 'block';
          }
        }

        function tryPlay() {
          if (audio && audio.paused) {
            const p = audio.play();
            if (p !== undefined) {
              p.then(() => {
                updateUI(true);
              }).catch(() => {
                updateUI(false);
              });
            }
          }
        }

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (audio.paused) {
            tryPlay();
          } else {
            audio.pause();
            updateUI(false);
          }
        });

        const startAudioOnFirstTouch = () => {
          if (!userInteracted) {
            userInteracted = true;
            tryPlay();
          }
        };

        window.addEventListener('click', startAudioOnFirstTouch, { passive: true });
        window.addEventListener('touchstart', startAudioOnFirstTouch, { passive: true });
        window.addEventListener('scroll', startAudioOnFirstTouch, { passive: true, once: true });
      })();
    </script>
  </body>
</html>
